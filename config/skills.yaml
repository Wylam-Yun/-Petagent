skills:
  - id: device.info
    enabled: true
    permissions:
      - device
  - id: weather.current
    enabled: true
    permissions:
      - network
    config:
      default_location: current
      provider: wttr_in
      endpoint: https://wttr.in
      timeout_seconds: 5
limits:
  max_skill_calls_per_event: 2
  timeout_ms: 8000
