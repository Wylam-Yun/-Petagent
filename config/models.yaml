providers:
  llm:
    name: siliconflow_slow
    model: deepseek-ai/DeepSeek-V4-Flash
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 45
    auth_scheme: bearer
    max_tokens: 1200
    chat_template_kwargs:
      enable_thinking: false
  llm_fast:
    name: siliconflow_fast
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 20
    auth_scheme: bearer
    max_tokens: 900
    chat_template_kwargs:
      enable_thinking: false
  asr:
    name: configurable_http_asr
    model: TeleAI/TeleSpeechASR
    base_url_env:
      - SILICONFLOW_BASE_URL
      - ASR_BASE_URL
    api_key_env:
      - SILICONFLOW_API_KEY
      - ASR_API_KEY
    timeout_seconds: 12
    connect_timeout_seconds: 4
    read_timeout_seconds: 12
    protocol: http
    endpoint: /audio/transcriptions
    request_format: multipart
    file_field: file
    model_field: model
    fallback_models:
      - FunAudioLLM/SenseVoiceSmall
    language_field: language
    language_code: zh-CN
    auth_scheme: bearer
    transcript_paths:
      - text
      - transcript
      - transcription
      - data.text
      - result.text
      - results[].alternatives[].transcript
      - results[].channels[].alternatives[].transcript
    confidence_paths:
      - confidence
      - data.confidence
      - result.confidence
      - result.score
      - results[].alternatives[].confidence
      - results[].channels[].alternatives[].confidence
    transient_retries: 2
    retry_backoff_seconds: 0.2
  asr_fallback:
    name: mimo_asr
    model: mimo-v2.5-asr
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 30
    protocol: mimo_chat
    endpoint: /chat/completions
    auth_scheme: api-key
    language: auto
    transient_retries: 1
    retry_backoff_seconds: 0.2
  tts:
    name: siliconflow_tts
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:claire
    format: mp3
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 60
    api_style: openai_speech
    endpoint: /audio/speech
    auth_scheme: bearer
    speed: 1.0
    include_voice_prompt: false
    style:
      name: cute_soft
      speed: slightly_fast
      emotion: warm
  llm_fallback:
    name: mimo
    model: mimo-v2-omni
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 60
  llm_fast_fallback:
    name: mimo_fast_fallback
    model: mimo-v2.5
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 30
    chat_template_kwargs:
      enable_thinking: false
  memory_summarizer:
    name: mimo_memory_summarizer
    model_env: MIMO_MEMORY_MODEL
    default_model: mimo-v2.5
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 30
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 600
  tts_fallback:
    name: mimo
    model_env: MIMO_TTS_MODEL
    default_model: mimo-v2.5-tts
    voice_env: MIMO_TTS_VOICE
    default_voice: 冰糖
    format_env: MIMO_TTS_FORMAT
    default_format: wav
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 120
    style:
      name: cute_soft
      speed: slightly_fast
      emotion: warm
  tts_voiceclone:
    name: weilin
    model_env: WEILIN_TTS_MODEL
    default_model: mimo-v2.5-tts-voiceclone
    voice_env: WEILIN_TTS_SAMPLE
    default_voice: backend/secrets/voice_clone/weilin.wav
    format_env: WEILIN_TTS_FORMAT
    default_format: wav
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 120
    voice_is_file: true
    style:
      name: natural_close
      speed: normal
      emotion: warm
