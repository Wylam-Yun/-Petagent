providers:
  llm:
    name: siliconflow_slow
    model: deepseek-ai/DeepSeek-V4-Flash
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 45
    auth_scheme: bearer
    max_tokens: 1200
    chat_template_kwargs:
      enable_thinking: false
    proxy_url_env:
      - SILICONFLOW_PROXY_URL
      - PETAGENT_PROXY_URL
      - PETAGENT_ASR_PROXY_URL
  llm_fast:
    name: siliconflow_fast
    model: Qwen/Qwen3-30B-A3B-Instruct-2507
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 20
    auth_scheme: bearer
    max_tokens: 900
    chat_template_kwargs:
      enable_thinking: false
    proxy_url_env:
      - SILICONFLOW_PROXY_URL
      - PETAGENT_PROXY_URL
      - PETAGENT_ASR_PROXY_URL
  audio_understanding:
    name: mimo
    model: mimo-v2-omni
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 60
  asr:
    name: configurable_http_asr
    model: TeleAI/TeleSpeechASR
    base_url_env:
      - SILICONFLOW_BASE_URL
      - ASR_BASE_URL
    api_key_env:
      - SILICONFLOW_API_KEY
      - ASR_API_KEY
    timeout_seconds: 8
    protocol: http
    endpoint: /audio/transcriptions
    request_format: multipart
    file_field: file
    model_field: model
    fallback_models:
      - FunAudioLLM/SenseVoiceSmall
      - iic/SenseVoiceSmall
    language_field: language
    language_code: zh
    auth_scheme: bearer
    proxy_url_env:
      - SILICONFLOW_PROXY_URL
      - PETAGENT_PROXY_URL
      - ASR_PROXY_URL
      - PETAGENT_ASR_PROXY_URL
    transcript_paths:
      - text
      - transcript
      - transcription
      - data.text
      - result.text
      - results[].alternatives[].transcript
      - results[].channels[].alternatives[].transcript
    confidence_paths:
      - confidence
      - data.confidence
      - result.confidence
      - result.score
      - results[].alternatives[].confidence
      - results[].channels[].alternatives[].confidence
    transient_retries: 2
    retry_backoff_seconds: 0.2
  tts:
    name: siliconflow_tts
    model: FunAudioLLM/CosyVoice2-0.5B
    voice: FunAudioLLM/CosyVoice2-0.5B:claire
    format: mp3
    base_url_env: SILICONFLOW_BASE_URL
    api_key_env: SILICONFLOW_API_KEY
    timeout_seconds: 60
    api_style: openai_speech
    endpoint: /audio/speech
    auth_scheme: bearer
    speed: 1.0
    include_voice_prompt: false
    proxy_url_env:
      - SILICONFLOW_PROXY_URL
      - PETAGENT_PROXY_URL
      - PETAGENT_ASR_PROXY_URL
    style:
      name: cute_soft
      speed: slightly_fast
      emotion: warm
  llm_fallback:
    name: mimo
    model: mimo-v2-omni
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 60
  llm_fast_fallback:
    name: mimo_fast_fallback
    model: mimo-v2.5
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 30
    chat_template_kwargs:
      enable_thinking: false
  memory_summarizer:
    name: mimo_memory_summarizer
    model_env: MIMO_MEMORY_MODEL
    default_model: mimo-v2.5
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 30
    chat_template_kwargs:
      enable_thinking: false
    max_tokens: 600
  tts_fallback:
    name: mimo
    model: mimo-v2.5-tts
    voice: 冰糖
    format: wav
    base_url_env: MIMO_BASE_URL
    api_key_env: MIMO_API_KEY
    timeout_seconds: 120
    style:
      name: cute_soft
      speed: slightly_fast
      emotion: warm
