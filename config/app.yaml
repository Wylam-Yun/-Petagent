runtime:
  name: PetAgent
  pet_name: Momo
  schema_version: "0.1"
server:
  host: 0.0.0.0
  port: 8000
paths:
  data_dir: backend/data
  audio_dir: backend/static/audio
  upload_dir: backend/data/uploads
  frontend_dist: frontend/dist
audio_cache:
  max_audio_cache_mb: 200
  max_audio_age_hours: 72
state:
  initial:
    name: Momo
    mood: idle
    energy: 72
    intimacy: 40
    hunger: 30
    cleanliness: 85
    loneliness: 35
    sleepiness: 15
    mode: idle
activation:
  foreground_wake_enabled: true
  background_wake_enabled: false
  wake_phrases:
    - hi momo
    - hey momo
    - 嗨 momo
    - 你好 momo
  exit_phrases:
    - momo休息吧
    - 退出
    - 先这样
    - 不用陪了
  min_wake_confidence: 0.75
voice:
  default_route: fast
  slow_fallback_enabled: true
  allowed_audio_types:
    - audio/webm
    - audio/wav
    - audio/mpeg
    - audio/mp4
  max_audio_bytes: 8388608
  asr_min_confidence: 0.25
  asr_wav_contract:
    required_channels: 1
    required_sample_width: 2
    accepted_sample_rates:
      - 16000
      - 44100
      - 48000
  normalize_pet_name: true
  route_debug_enabled: false
