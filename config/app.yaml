runtime:
  name: PetAgent
  pet_name: Momo
  schema_version: "0.1"
server:
  host: 0.0.0.0
  port: 8000
paths:
  data_dir: backend/data
  audio_dir: backend/static/audio
  upload_dir: backend/data/uploads
  frontend_dist: frontend/dist
audio_cache:
  max_audio_cache_mb: 200
  max_audio_age_hours: 72
state:
  initial:
    name: Momo
    mood: idle
    energy: 72
    intimacy: 40
    hunger: 30
    cleanliness: 85
    loneliness: 35
    sleepiness: 15
    mode: idle
activation:
  foreground_wake_enabled: true
  background_wake_enabled: false
  wake_phrases:
    - hi momo
    - hey momo
    - 嗨 momo
  exit_phrases:
    - momo休息吧
    - 退出
    - 先这样
    - 不用陪了
  min_wake_confidence: 0.75
